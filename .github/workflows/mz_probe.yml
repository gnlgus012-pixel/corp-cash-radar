name: 메자닌 납입일 점검 (수동)
on:
  workflow_dispatch:
    inputs:
      rcept:
        description: "접수번호(쉼표)"
        required: true
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt && mkdir -p cache
      - env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          MZ_RCEPT: ${{ inputs.rcept }}
        run: python scripts/mz_probe.py
