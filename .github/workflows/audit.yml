name: 누락 공시 점검

on:
  workflow_dispatch:
    inputs:
      types:
        description: "점검할 공시 유형 (B 주요사항, C 발행, I 거래소, E 기타)"
        default: "B,C,I,E"

permissions:
  contents: write

concurrency:
  group: radar-update   # 데이터 갱신과 겹치지 않게 같은 줄에 세움
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 실행 시점의 최신 데이터와 비교 (트리거 커밋이 아니라)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt && mkdir -p cache
      - name: 화면 데이터 복호화 (점검 비교용, 저장소에는 올리지 않음)
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          if [ -f docs/data/data.enc ]; then python scripts/seal.py open docs/data/data.enc docs/data/data.json; fi
      - name: 점검
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          AUDIT_TYPES: ${{ github.event.inputs.types || 'B,C,I,E' }}
          RADAR_TIME_BUDGET_MIN: "55"
        run: python scripts/audit.py
      - name: 결과 반영
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/audit.json
          git diff --cached --quiet || { git commit -m "audit: $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M') 누락 공시 점검"; git pull --rebase origin main; git push; }
