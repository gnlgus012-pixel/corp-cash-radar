name: 누락 공시 점검

on:
  workflow_dispatch:
    inputs:
      types:
        description: "점검할 공시 유형 (B 주요사항, C 발행, I 거래소, E 기타)"
        default: "B,C,I,E"
  push:
    branches: [main]
    paths:
      - "scripts/audit.py"
      - ".github/workflows/audit.yml"

permissions:
  contents: write

concurrency:
  group: radar-update   # 데이터 갱신과 겹치지 않게 같은 줄에 세움
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt && mkdir -p cache
      - name: 점검
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          AUDIT_TYPES: ${{ github.event.inputs.types || 'B,C,I,E' }}
          RADAR_TIME_BUDGET_MIN: "55"
        run: python scripts/audit.py
      - name: 결과 반영
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/audit.json
          git diff --cached --quiet || { git commit -m "audit: $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M') 누락 공시 점검"; git pull --rebase origin main; git push; }
