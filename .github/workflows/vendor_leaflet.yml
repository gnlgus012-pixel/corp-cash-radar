name: 지도 라이브러리 내려받기 (수동, 1회)
# Leaflet 1.9.4 (BSD-2) 를 docs/vendor/leaflet 에 넣는다 — 회사망에서 외부 CDN이 막혀도 지도가 뜨도록
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          npm pack leaflet@1.9.4
          tar xzf leaflet-1.9.4.tgz
          mkdir -p docs/vendor/leaflet
          cp package/dist/leaflet.js package/dist/leaflet.css package/LICENSE docs/vendor/leaflet/
          cp -r package/dist/images docs/vendor/leaflet/
          rm -rf package leaflet-1.9.4.tgz
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/vendor/leaflet
          git diff --cached --quiet || { git commit -m "지도 라이브러리(Leaflet 1.9.4) 추가 [skip ci]"; git pull --rebase origin main; git push; }
