name: 법인 자금 레이더 데이터 갱신

on:
  schedule:
    # 평일 한국시간 07:00 (= UTC 전날 22:00, 일~목). GitHub 사정으로 수십 분 늦을 수 있음
    - cron: "0 22 * * 0-4"
  workflow_dispatch: {}   # Actions 탭에서 [Run workflow] 버튼으로 수동 실행
  push:                   # 수집 코드·설정을 고치면 바로 한 번 실행 (데이터 갱신 커밋으로는 실행 안 됨)
    branches: [main]
    paths:
      - "scripts/collect.py"
      - "scripts/holders.py"
      - "config/**"
      - ".github/workflows/daily.yml"

permissions:
  contents: write

concurrency:
  group: radar-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 트리거 커밋이 아니라 최신 main (그 사이 올라온 데이터 커밋과 충돌 방지)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # 공시·재무 캐시는 저장소에 올리지 않고 Actions 캐시에 보관 (증분 수집용)
      - name: 캐시 복원
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: radar-cache-${{ github.run_id }}
          restore-keys: radar-cache-

      - run: pip install -r requirements.txt && mkdir -p cache

      - name: 데이터 수집
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          RADAR_TIME_BUDGET_MIN: "40"   # 이 시간이 지나면 모은 데까지 저장하고 정상 종료
        run: python scripts/collect.py

      # 대주주(개인) 자금 공시 — 수집 결과(data.json)에 붙임. 실패해도 나머지 화면은 그대로
      - name: 대주주 공시 수집
        if: always()
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          RADAR_TIME_BUDGET_MIN: "25"
        run: python scripts/holders.py

      # 화면 데이터를 비밀번호로 암호화 (원본은 올리지 않음). SITE_PASSWORD 가 없으면 원본 그대로
      - name: 암호화
        if: always()
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          SITE_USERS: ${{ secrets.SITE_USERS }}
          VISIT_LOG_URL: ${{ secrets.VISIT_LOG_URL }}
        run: python scripts/seal.py seal docs/data/data.json docs/data/data.enc

      # 수집이 실패·중단돼도 그때까지 모은 캐시는 저장 → 다음 실행이 이어서 수집
      - name: 캐시 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: radar-cache-${{ github.run_id }}

      - name: 결과 반영
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/data/ reports/
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M') 갱신"
            git pull --rebase -X theirs origin main
            git push
          fi
