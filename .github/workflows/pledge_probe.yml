name: 주식담보 원문 확인 (일회성)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 캐시 복원
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: radar-cache-${{ github.run_id }}
          restore-keys: radar-cache-
      - run: pip install -r requirements.txt && mkdir -p cache
      - env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          RADAR_TIME_BUDGET_MIN: "20"
        run: python scripts/pledge_probe.py
      - name: 결과 (암호화해서 출력)
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          gzip -9 -c pledge_probe.json | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:SITE_PASSWORD | base64 -w 0 > p.b64
          echo "PROBE_BEGIN"; cat p.b64; echo; echo "PROBE_END"
