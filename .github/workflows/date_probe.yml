name: 자금 일자 조사 (1회성)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt && mkdir -p cache
      - env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          RADAR_TIME_BUDGET_MIN: "15"
        run: python scripts/date_probe.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/date_probe.json
          git diff --cached --quiet || { git commit -m "probe: 자금 일자 조사"; git pull --rebase -X theirs origin main; git push; }
