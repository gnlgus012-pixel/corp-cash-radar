name: QR 코드 만들기 (수동)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  qr:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get install -y -q fonts-noto-cjk >/dev/null && pip install -q qrcode pillow
      - run: python scripts/make_qr.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/icons/qr.png docs/icons/qr_card.png
          git diff --cached --quiet || { git commit -m "QR 코드 생성"; git pull --rebase -X theirs origin main; git push; }
